identity:
  author: "contrastcyber"
  name: "contrastapi"
  label:
    en_US: "ContrastAPI"
    zh_Hans: "ContrastAPI"
  description:
    en_US: "Security data from ContrastAPI: CVE, CISA KEV, EPSS and exploit lookups, package advisories, domain, DNS, TLS, e-mail and IP checks, and CVE monitoring with a Pro key."
    zh_Hans: "Security data from ContrastAPI: CVE, CISA KEV, EPSS and exploit lookups, package advisories, domain, DNS, TLS, e-mail and IP checks, and CVE monitoring with a Pro key."
  icon: "logo.png"
  tags:
    - "utilities"
    - "search"
    - "business"
credentials_for_provider:
  api_key:
    type: secret-input
    required: false
    label:
      en_US: "API key (optional)"
    placeholder:
      en_US: "contrastapi_..."
    help:
      en_US: "Without a key, calls use the free hourly credits of the IP address your Dify server calls from. Other users of a shared Dify host use the same credits. A Pro key gives more credits and the watchlist tools."
    url: "https://api.contrastcyber.com/pricing"
