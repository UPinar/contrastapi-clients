identity:
  name: "cve_leading"
  author: "contrastcyber"
  label:
    en_US: "Leading CVEs by EPSS"
description:
  human:
    en_US: "List the CVEs most likely to be exploited, by EPSS score (the probability of exploitation in the next 30 days), with a verdict on the top score."
  llm: "List the CVEs most likely to be exploited, by EPSS score (the probability of exploitation in the next 30 days), with a verdict on the top score. To rank by composite risk score, call the cve_triage tool. Costs 1 credit."
parameters:
  - name: "vendor"
    type: string
    required: false
    label:
      en_US: "Vendor"
    human_description:
      en_US: "Exact vendor name as cpe_search lists it, e.g. apache. At most 128 characters."
    llm_description: "Exact vendor name as cpe_search lists it, e.g. apache. At most 128 characters."
    form: llm
  - name: "product"
    type: string
    required: false
    label:
      en_US: "Product"
    human_description:
      en_US: "Exact product name as cpe_search lists it, e.g. log4j. At most 128 characters."
    llm_description: "Exact product name as cpe_search lists it, e.g. log4j. At most 128 characters."
    form: llm
  - name: "min_epss"
    type: number
    required: false
    label:
      en_US: "Min EPSS"
    human_description:
      en_US: "Lowest EPSS score, a probability from 0 to 1, e.g. 0.1. Minimum 0. Maximum 1."
    llm_description: "Lowest EPSS score, a probability from 0 to 1, e.g. 0.1. Minimum 0. Maximum 1."
    form: llm
  - name: "in_kev"
    type: boolean
    required: false
    label:
      en_US: "In KEV"
    human_description:
      en_US: "true lists only CVEs in CISA KEV, false only CVEs not in it"
    llm_description: "true lists only CVEs in CISA KEV, false only CVEs not in it"
    form: llm
  - name: "known_ransomware"
    type: boolean
    required: false
    label:
      en_US: "Known Ransomware"
    human_description:
      en_US: "Only CVEs whose CISA KEV entry notes known ransomware use"
    llm_description: "Only CVEs whose CISA KEV entry notes known ransomware use"
    form: llm
  - name: "has_nuclei_template"
    type: boolean
    required: false
    label:
      en_US: "Has Nuclei Template"
    human_description:
      en_US: "Only CVEs with a Nuclei detection template"
    llm_description: "Only CVEs with a Nuclei detection template"
    form: llm
  - name: "include_rejected"
    type: boolean
    required: false
    label:
      en_US: "Include Rejected"
    human_description:
      en_US: "Also list the CVEs that NVD marks Rejected"
    llm_description: "Also list the CVEs that NVD marks Rejected"
    form: llm
  - name: "limit"
    type: number
    required: false
    label:
      en_US: "Limit"
    human_description:
      en_US: "How many CVEs to list, highest EPSS first. Minimum 1. Maximum 50. Default 20."
    llm_description: "How many CVEs to list, highest EPSS first. Minimum 1. Maximum 50. Default 20."
    form: llm
    default: 20
extra:
  python:
    source: "tools/cve_leading.py"
