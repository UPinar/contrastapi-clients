    en_US: "Look up a domain's DNS records: A, AAAA, MX, NS, TXT, CNAME, SOA and CAA."
  llm: "Look up a domain's DNS records: A, AAAA, MX, NS, TXT, CNAME, SOA and CAA. A record type the resolver could not answer is listed under unavailable. Costs 1 credit."
