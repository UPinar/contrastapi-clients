version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /sdk/node
      - /vscode-extension
      - /claude-desktop-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # @types/vscode follows engines.vscode by hand. A newer one lets the code
    # call an API that the oldest supported VS Code does not have.
    # A TypeScript major goes in by hand: 7.0 failed the VS Code tests.
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /sdk/python
    # The SDK is a library: a floor goes up only when the range shuts out the
    # new version. A higher floor would only narrow what users can install.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
