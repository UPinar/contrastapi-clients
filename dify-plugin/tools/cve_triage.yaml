identity:
  name: "cve_triage"
  author: "contrastcyber"
  label:
    en_US: "CVE Triage"
description:
  human:
    en_US: "Rank the CVEs of a vendor or product by composite risk score, at or above the optional min_risk_score argument, as lean rows (cve_id, risk_score, label)."
  llm: "Rank the CVEs of a vendor or product by composite risk score, at or above the optional min_risk_score argument, as lean rows (cve_id, risk_score, label). Call the cve_lookup tool for detail, and the cpe_search tool to find the names. Costs 1 credit."
parameters:
  - name: "vendor"
    type: string
    required: false
    label:
      en_US: "Vendor"
    human_description:
      en_US: "CPE vendor name in lower case, e.g. microsoft. The cpe_search tool finds it. At most 128 characters."
    llm_description: "CPE vendor name in lower case, e.g. microsoft. The cpe_search tool finds it. At most 128 characters."
    form: llm
  - name: "product"
    type: string
    required: false
    label:
      en_US: "Product"
    human_description:
      en_US: "CPE product name in lower case with underscores, e.g. windows_10. The cpe_search tool finds it. At most 128 characters."
    llm_description: "CPE product name in lower case with underscores, e.g. windows_10. The cpe_search tool finds it. At most 128 characters."
    form: llm
  - name: "min_risk_score"
    type: number
    required: false
    label:
      en_US: "Min Risk Score"
    human_description:
      en_US: "Composite risk-score threshold. Minimum 0. Maximum 100."
    llm_description: "Composite risk-score threshold. Minimum 0. Maximum 100."
    form: llm
  - name: "include_rejected"
    type: boolean
    required: false
    label:
      en_US: "Include Rejected"
    human_description:
      en_US: "Also list the CVEs that NVD marks Rejected"
    llm_description: "Also list the CVEs that NVD marks Rejected"
    form: llm
  - name: "limit"
    type: number
    required: false
    label:
      en_US: "Limit"
    human_description:
      en_US: "Number of results on one page. Minimum 1. Maximum 100. Default 20."
    llm_description: "Number of results on one page. Minimum 1. Maximum 100. Default 20."
    form: llm
    default: 20
  - name: "offset"
    type: number
    required: false
    label:
      en_US: "Offset"
    human_description:
      en_US: "Number of results to skip, for the next page. Minimum 0. Maximum 10000. Default 0."
    llm_description: "Number of results to skip, for the next page. Minimum 0. Maximum 10000. Default 0."
    form: llm
    default: 0
extra:
  python:
    source: "tools/cve_triage.py"
