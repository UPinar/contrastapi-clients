identity:
  name: "password_check"
  author: "contrastcyber"
  label:
    en_US: "Breached Password Check"
description:
  human:
    en_US: "Check whether a password appears in Have I Been Pwned's Pwned Passwords list."
  llm: "Check whether a password appears in Have I Been Pwned's Pwned Passwords list. The text you type still passes through the AI model and Dify's logs, so check a candidate password, not one in use. Costs 1 credit."
parameters:
  - name: "password"
    type: secret-input
    required: true
    label:
      en_US: "Password"
    human_description:
      en_US: "The password to check. The plugin sends only its SHA-1 to ContrastAPI. The text you type still passes through the AI model and Dify's logs, so check a candidate password, not one in use."
    llm_description: "The password to check. The plugin sends only its SHA-1 to ContrastAPI. The text you type still passes through the AI model and Dify's logs, so check a candidate password, not one in use."
    form: llm
extra:
  python:
    source: "tools/password_check.py"
