identity:
  name: "cve_products"
  author: "contrastcyber"
  label:
    en_US: "CVE Affected Products"
description:
  human:
    en_US: "The products a CVE affects, one page at a time, with the vulnerable products first."
  llm: "The products a CVE affects, one page at a time, with the vulnerable products first. The vendor and product arguments keep only the products with that exact name. For the CVEs of one product, call cve_search. Costs 1 credit."
parameters:
  - name: "cve_id"
    type: string
    required: true
    label:
      en_US: "CVE ID"
    human_description:
      en_US: "CVE ID, e.g. CVE-2021-44228. At most 24 characters."
    llm_description: "CVE ID, e.g. CVE-2021-44228. At most 24 characters."
    form: llm
  - name: "vendor"
    type: string
    required: false
    label:
      en_US: "Vendor"
    human_description:
      en_US: "Exact vendor name, as affected_products writes it. At most 128 characters."
    llm_description: "Exact vendor name, as affected_products writes it. At most 128 characters."
    form: llm
  - name: "product"
    type: string
    required: false
    label:
      en_US: "Product"
    human_description:
      en_US: "Exact product name, as affected_products writes it. At most 128 characters."
    llm_description: "Exact product name, as affected_products writes it. At most 128 characters."
    form: llm
  - name: "limit"
    type: number
    required: false
    label:
      en_US: "Limit"
    human_description:
      en_US: "Products per page. Minimum 1. Maximum 50. Default 20."
    llm_description: "Products per page. Minimum 1. Maximum 50. Default 20."
    form: llm
    default: 20
  - name: "offset"
    type: number
    required: false
    label:
      en_US: "Offset"
    human_description:
      en_US: "Products to skip; pass next_offset of the previous page. Minimum 0. Default 0."
    llm_description: "Products to skip; pass next_offset of the previous page. Minimum 0. Default 0."
    form: llm
    default: 0
extra:
  python:
    source: "tools/cve_products.py"
