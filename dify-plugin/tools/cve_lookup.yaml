identity:
  name: "cve_lookup"
  author: "contrastcyber"
  label:
    en_US: "CVE Lookup"
description:
  human:
    en_US: "Full CVE record by ID (CVSS, EPSS, KEV, CWE, references, CISA SSVC, Nuclei templates), with the optional GitHub Security Advisory."
  llm: "Full CVE record by ID (CVSS, EPSS, KEV, CWE, references, CISA SSVC, Nuclei templates), with the optional GitHub Security Advisory. Call the cve_products tool for every affected product. If your SSVC level is unknown, read high. Costs 1 credit."
parameters:
  - name: "cve_id"
    type: string
    required: true
    label:
      en_US: "CVE ID"
    human_description:
      en_US: "CVE ID, e.g. CVE-2021-44228. At most 24 characters."
    llm_description: "CVE ID, e.g. CVE-2021-44228. At most 24 characters."
    form: llm
  - name: "include_ghsa"
    type: boolean
    required: false
    label:
      en_US: "Include Ghsa"
    human_description:
      en_US: "Add the GitHub Security Advisory of the CVE, from the local copy of the GitHub Advisory Database"
    llm_description: "Add the GitHub Security Advisory of the CVE, from the local copy of the GitHub Advisory Database"
    form: llm
extra:
  python:
    source: "tools/cve_lookup.py"
