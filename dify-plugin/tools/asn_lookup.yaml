identity:
  name: "asn_lookup"
  author: "contrastcyber"
  label:
    en_US: "ASN Lookup"
description:
  human:
    en_US: "Look up an autonomous system by number, such as AS15169, or by an IP address it holds: name, country and one page of its IPv4 and IPv6 prefixes, derived from IPtoASN."
  llm: "Look up an autonomous system by number, such as AS15169, or by an IP address it holds: name, country and one page of its IPv4 and IPv6 prefixes, derived from IPtoASN. Costs 1 credit."
parameters:
  - name: "target"
    type: string
    required: true
    label:
      en_US: "Target"
    human_description:
      en_US: "AS number, such as AS15169 or 15169, or a public IPv4 or IPv6 address, such as 8.8.8.8. At most 45 characters."
    llm_description: "AS number, such as AS15169 or 15169, or a public IPv4 or IPv6 address, such as 8.8.8.8. At most 45 characters."
    form: llm
  - name: "limit"
    type: number
    required: false
    label:
      en_US: "Limit"
    human_description:
      en_US: "Number of results on one page. Minimum 1. Maximum 50. Default 50."
    llm_description: "Number of results on one page. Minimum 1. Maximum 50. Default 50."
    form: llm
    default: 50
  - name: "offset"
    type: number
    required: false
    label:
      en_US: "Offset"
    human_description:
      en_US: "Number of results to skip, for the next page. Minimum 0. Default 0."
    llm_description: "Number of results to skip, for the next page. Minimum 0. Default 0."
    form: llm
    default: 0
extra:
  python:
    source: "tools/asn_lookup.py"
